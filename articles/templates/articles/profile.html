<!DOCTYPE html>
<html>
<head>
    <title>Мой профиль</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        a { color: #007aff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .list-item { padding: 10px 0; border-bottom: 1px solid #eee; }
        .list-item:last-child { border-bottom: none; }
        .btn-theme { background-color: #e5e5ea; color: #333; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        body.dark-mode { background-color: #1c1c1e; color: #f5f5f7; }
        body.dark-mode .card { background-color: #2c2c2e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode .btn-theme { background-color: #3a3a3c; color: #f5f5f7; }
        body.dark-mode .list-item { border-bottom-color: #444; }
    </style>
</head>
<body>
    <div class="header">
            <h1>Профиль: {{ user.username }}</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-theme">🌙 Темная</button>
                <a href="{% url 'article_list' %}">← На главную</a>
                
                <form action="{% url 'logout' %}" method="POST" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: #ff3b30; font-size: 16px; cursor: pointer; padding: 0;">Выйти</button>
                </form>
            </div>
        </div>

    <div class="card">
        <h2>Понравившиеся статьи:</h2>
        <div>
            {% for article in liked_articles %}
                <div class="list-item">
                    <a href="{% url 'article_detail' article.pk %}">{{ article.title }}</a>
                </div>
            {% empty %}
                <p style="color: #888;">Вы пока не лайкнули ни одной статьи.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        const btn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            btn.textContent = '☀️ Светлая';
        }
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                btn.textContent = '☀️ Светлая';
            } else {
                localStorage.setItem('theme', 'light');
                btn.textContent = '🌙 Темная';
            }
        });
    </script>
</body>
</html>
