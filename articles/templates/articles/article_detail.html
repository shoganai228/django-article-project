<!DOCTYPE html>
<html>
    
    
<head>
    <title>{{ article.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        a { color: #007aff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; transition: 0.3s; }
        .content { line-height: 1.6; font-size: 16px; margin-top: 20px; }
        .meta { margin-top: 30px; color: #888; font-size: 14px; border-top: 1px solid #eee; padding-top: 15px;}
        .btn-theme { background-color: #e5e5ea; color: #333; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        body.dark-mode { background-color: #1c1c1e; color: #f5f5f7; }
        body.dark-mode .card { background-color: #2c2c2e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode .meta { border-top-color: #444; color: #aaa; }
        body.dark-mode .btn-theme { background-color: #3a3a3c; color: #f5f5f7; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'article_list' %}">← Назад к ленте</a>
        <button id="theme-toggle" class="btn-theme">🌙 Темная</button>
    </div>
    
    <div class="card">
            <h1>{{ article.title }}</h1>
            
            <!-- Начало нового блока для фото -->
            {% if article.image %}
                <img src="{{ article.image.url }}" alt="{{ article.title }}" style="width: 100%; border-radius: 8px; margin-top: 15px;">
            {% endif %}
            <!-- Конец нового блока -->

            <div class="content">
                        {{ article.content|linebreaks }}
                    </div>
                    
                    {% if user.is_authenticated %}
                        <!-- Добавлен класс like-form -->
                        <form class="like-form" action="{% url 'like_article' article.pk %}" method="POST" style="margin-top: 20px;">
                            {% csrf_token %}
                            {% if request.user in article.likes.all %}
                                <!-- Дизайн кнопок приведен к единому стилю как на главной -->
                                <button type="submit" class="btn-theme btn-unlike" style="background-color: #ff3b30; color: white;">Убрать лайк</button>
                            {% else %}
                                <button type="submit" class="btn-theme" style="background-color: #007aff; color: white;">Поставить лайк</button>
                            {% endif %}
                        </form>
                    {% endif %}

                    <!-- Добавлен класс likes-count -->
                    <div class="meta likes-count">
                        Лайков собрано: {{ article.likes.count }}
                    </div>
        </div>

    <script>
        const btn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            btn.textContent = '☀️ Светлая';
        }
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                btn.textContent = '☀️ Светлая';
            } else {
                localStorage.setItem('theme', 'light');
                btn.textContent = '🌙 Темная';
            }
        });
    </script>
    <script>
            document.querySelectorAll('.like-form').forEach(form => {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const url = this.action;
                    const csrfToken = this.querySelector('[name=csrfmiddlewaretoken]').value;
                    const btn = this.querySelector('button');
                    const likesDisplay = document.querySelector('.likes-count');

                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': csrfToken,
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.liked) {
                            btn.textContent = 'Убрать лайк';
                            btn.style.backgroundColor = '#ff3b30';
                        } else {
                            btn.textContent = 'Поставить лайк';
                            btn.style.backgroundColor = '#007aff';
                        }
                        likesDisplay.textContent = `Лайков собрано: ${data.likes_count}`;
                    })
                    .catch(error => console.error('Ошибка:', error));
                });
            });
        </script>
</body>
</html>
