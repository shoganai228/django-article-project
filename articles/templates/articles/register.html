<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #333; max-width: 500px; margin: 50px auto; padding: 20px; transition: 0.3s; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background-color: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
        .btn:hover { opacity: 0.9; }
        a { color: #007aff; text-decoration: none; display: block; margin-top: 15px; text-align: center; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .helptext, ul.errorlist { font-size: 12px; color: #888; list-style-type: none; padding: 0; }
        
        body.dark-mode { background-color: #1c1c1e; color: #f5f5f7; }
        body.dark-mode .card { background-color: #2c2c2e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode input { background-color: #3a3a3c; border-color: #555; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center; margin-top: 0;">Создать аккаунт</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <a href="{% url 'article_list' %}">← Назад на главную</a>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
